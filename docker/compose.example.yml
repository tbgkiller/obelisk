# Obelisk - the only container you install by hand. It generates and runs the rest.
#
# The values below are the whole install-time configuration: two data folders, the
# Docker socket, and a published port. The two folders hold different things - settings
# in one, the big game files in the other. Obelisk asks Docker where each mount comes
# from on the host, so neither path is repeated as a variable that could drift.
# Everything else - maps, mods, rates, Discord, wipe schedules, time zone - is set in
# the web UI after this is running.
#
#   docker compose -f compose.example.yml up -d
#   docker logs obelisk        # prints the one-time setup code
#   open http://<host>:8088/setup

services:
  obelisk:
    image: ghcr.io/tbgkiller/obelisk:latest
    container_name: obelisk
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      # Obelisk's own settings: the cluster definition, mod list, credentials,
      # snapshots. Kilobytes, and the half that cannot be downloaded again.
      - /mnt/user/appdata/obelisk:/data
      # The large ARK files: server install, downloaded mods, world saves, shared
      # config and transfer data. Put this on fast storage - ASA is very I/O hungry.
      # Backups take the saves from here and skip the install and the mods, which
      # come back from the mod IDs stored in the folder above.
      - /mnt/user/appdata/ark:/ark
      # Lets Obelisk create and manage the map containers. See docs/ARCHITECTURE.md
      # for why this is the trade-off it is.
      - /var/run/docker.sock:/var/run/docker.sock
