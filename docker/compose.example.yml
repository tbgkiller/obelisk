# Obelisk - the only container you install by hand. It generates and runs the rest.
#
# The three values below are the whole install-time configuration: one data folder, the
# Docker socket, and a published port. Obelisk asks Docker where its own data mount
# comes from on the host, so the folder is named once here and nowhere else. Everything
# else - maps, mods, rates, Discord, wipe schedules, time zone - is set in the web UI
# after this is running.
#
#   docker compose -f compose.example.yml up -d
#   docker logs obelisk        # prints the one-time setup code
#   open http://<host>:8088/setup

services:
  obelisk:
    image: ghcr.io/tbgkiller/obelisk:latest
    container_name: obelisk
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      # One folder is the whole cluster: Obelisk's settings, every map's saves, the
      # shared config and the transfer data. Copy it and you have moved the cluster.
      # The ~20 GB game install goes in a sibling folder outside it, so a backup of
      # this one stays portable.
      - /mnt/user/appdata/obelisk:/data
      # Lets Obelisk create and manage the map containers. See docs/ARCHITECTURE.md
      # for why this is the trade-off it is.
      - /var/run/docker.sock:/var/run/docker.sock
