name: Publish Obelisk image

on:
  push:
    branches: [main]
    paths:
      - "obelisk/**"
      - "docker/**"
      - '.github/workflows/publish.yml'
  workflow_dispatch:

jobs:
  # The suite is the safety net every fix in this project has leaned on, and until now
  # nothing enforced it: the image built and published whether the tests passed or not,
  # so a red commit shipped exactly as fast as a green one.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet aiohttp pyyaml cryptography
      - name: Run the suite
        run: |
          fail=0
          for t in obelisk/test_*.py; do
            m=$(basename "$t" .py)
            echo "--- $m"
            python -m "obelisk.$m" || fail=1
          done
          exit $fail

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Uses the workflow's built-in GITHUB_TOKEN - no secret to create or paste.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub as well, because Unraid's update checker cannot reliably read GHCR:
      # a public pull there still needs a bearer-token exchange, which the checker
      # appears to skip, so it keeps a stale digest and reports "up to date" while an
      # update sits published. Hub needs no token dance.
      #
      # Staged, and gated on a step output rather than on the secret directly - the
      # secrets context is not available in a step-level `if`, and using it there is a
      # workflow that fails to parse rather than one that skips a step.
      - id: registries
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "images<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY}"
            if [ -n "$HUB_USER" ]; then echo "docker.io/${HUB_USER}/obelisk"; fi
            echo "EOF"
            if [ -n "$HUB_USER" ]; then echo "hub=yes"; else echo "hub=no"; fi
          } >> "$GITHUB_OUTPUT"

      # Skipped entirely until the owner adds the secrets, so the mirror cannot break
      # the build before it exists.
      - name: Log in to Docker Hub
        if: steps.registries.outputs.hub == 'yes'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
