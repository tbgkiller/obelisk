name: Publish Obelisk image

on:
  push:
    branches: [main]
    paths:
      - "obelisk/**"
      - "docker/**"
      - '.github/workflows/publish.yml'
  workflow_dispatch:

jobs:
  # The suite is the safety net every fix in this project has leaned on, and until now
  # nothing enforced it: the image built and published whether the tests passed or not,
  # so a red commit shipped exactly as fast as a green one.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet aiohttp pyyaml cryptography
      - name: Run the suite
        run: |
          fail=0
          for t in obelisk/test_*.py; do
            m=$(basename "$t" .py)
            echo "--- $m"
            python -m "obelisk.$m" || fail=1
          done
          exit $fail

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Uses the workflow's built-in GITHUB_TOKEN - no secret to create or paste.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub as well, because Unraid's update checker cannot reliably read GHCR.
      # It needs a bearer-token exchange even for a public pull, and Unraid appears to
      # skip it - so the checker records a stale digest and reports "up to date" when an
      # update exists. A confident wrong answer is worse than an error: the user is
      # never told there is anything to apply. Hub needs no token dance.
      #
      # Staged: with no DOCKERHUB_USERNAME secret this step is skipped and the build
      # publishes to GHCR exactly as before, so adding the mirror cannot break CI. Once
      # the secrets exist, one build pushes to both and the tags cannot drift.
      - name: Log in to Docker Hub (skipped until the secrets exist)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Built as a list rather than inlined, so that with no Hub secret the images list
      # is GHCR alone rather than GHCR plus a blank line, which metadata-action rejects.
      - id: registries
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "images<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY}"
            if [ -n "$HUB_USER" ]; then echo "docker.io/${HUB_USER}/obelisk"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
